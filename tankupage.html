<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6d949">
  <meta name="description" content="تأكيد استلام المعلومات المرسلة إلى مشروع مستقل.">
  <title>تم استلام طلبك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    :root{--bg:#f6d949;--ink:#26301e;--muted:#475334;--font-ar:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;--font-fr:"Inter","Segoe UI",Arial,sans-serif}
    html{font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:30px;overflow-x:hidden;position:relative;background:var(--bg);color:var(--ink);font-family:var(--font-ar);line-height:1.85}
    body:before,body:after{content:"";position:fixed;width:70vw;height:70vw;border:1px solid #26301e12;border-radius:50%;pointer-events:none;z-index:0}
    body:before{top:-50vw;left:-15vw}body:after{bottom:-50vw;right:-15vw}
    .thank{position:relative;z-index:1;text-align:center;width:min(620px,100%);animation:enter .8s cubic-bezier(.2,.8,.2,1) both}
    .brand{display:inline-block;margin-bottom:42px;padding:8px 15px;border:1px solid #26301e35;border-radius:999px;color:#344126;font-size:12px;font-weight:800;letter-spacing:.04em}
    .icon{width:110px;height:110px;margin:0 auto 30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 0 0 14px #26301e08}
    .icon svg{width:65px;height:65px}.icon path{stroke-dasharray:70;stroke-dashoffset:70;animation:check .8s .3s forwards}
    .kicker{display:block;color:#526034;font-size:14px;font-weight:800}
    h1{font-size:clamp(32px,5vw,48px);line-height:1.5;font-weight:800;margin:14px 0}
    p{max-width:490px;margin:0 auto;color:var(--muted);font-size:17px;line-height:2}
    .disclosure{max-width:500px;margin:22px auto 0;padding:12px 16px;border:1px solid #26301e30;border-radius:12px;color:#3f4b2d;background:#ffffff30;font-size:13px;line-height:1.9}
    .line{width:45px;height:3px;border-radius:5px;background:#26301e45;margin:30px auto 0}
    @keyframes enter{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}
    @keyframes check{to{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}.icon path{stroke-dashoffset:0}}
    @media(max-width:500px){body{padding:24px}.brand{margin-bottom:35px}.icon{width:90px;height:90px}p{font-size:15px}.disclosure{font-size:12px}}
    html[lang=fr] body{direction:ltr;font-family:var(--font-fr);line-height:1.75}
    html[lang=fr] .brand{font-family:var(--font-fr);letter-spacing:.02em}
    html[lang=fr] h1{font-weight:700;letter-spacing:-.035em;line-height:1.2}
  </style>
</head>
<body>
  <main class="thank">
    <span class="brand" id="brand">مشروع مستقل</span>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 60 60" fill="none">
        <path d="M14 30L25 41L46 19" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="kicker" id="kicker">تم استلام معلوماتك</span>
    <h1 id="title">تم تسجيل طلبك بنجاح</h1>
    <p id="message">شكرًا لإرسال طلبك. تم استلام المعلومات التي أدخلتها، وسيتواصل معك مسؤول هذا المشروع المستقل عبر بيانات الاتصال التي قدمتها إذا كانت هناك حاجة إلى متابعة الطلب.</p>
   
    <div class="line" aria-hidden="true"></div>
  </main>
  <script>
    (() => {
      const language = new URLSearchParams(window.location.search).get("lang");
      if (language !== "fr") return;
      document.documentElement.lang = "fr";
      document.documentElement.dir = "ltr";
      document.title = "Demande reçue";
      document.getElementById("brand").textContent = "PROJET INDÉPENDANT";
      document.getElementById("kicker").textContent = "CONFIRMATION DE RÉCEPTION";
      document.getElementById("title").textContent = "Votre demande a bien été enregistrée";
      document.getElementById("message").textContent = "Merci d’avoir envoyé votre demande. Les informations saisies ont bien été reçues. Le responsable de ce projet indépendant pourra vous contacter aux coordonnées fournies si un suivi est nécessaire.";
      document.getElementById("disclosure").textContent = "Information : cette page appartient à un projet indépendant. Elle ne représente pas Wafacash ni aucune autre institution financière ou marque, et ne prétend à aucun partenariat ou agrément officiel.";
    })();
  </script>
</body>
</html>
